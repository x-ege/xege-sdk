# CMake Format 配置文件 - CLion 风格
# 使用方法: pip install cmake-format
# 然后在 VSCode 中安装 cheshirekow.cmake-format 插件

# ====================================================
# 格式化选项
# ====================================================
format:
  # 行宽限制（CLion 默认 120）
  line_width: 120
  
  # 制表符大小（CLion 默认 4）
  tab_size: 4
  
  # 使用制表符还是空格（CLion 默认空格）
  use_tabchars: false
  
  # 续行缩进（CLion 默认与 tab_size 相同）
  fractional_tab_policy: 'use-space'
  
  # 控制语句名称与括号之间是否有空格（CLion 默认无空格）
  separate_ctrl_name_with_space: false
  
  # 函数名称与括号之间是否有空格（CLion 默认无空格）
  separate_fn_name_with_space: false
  
  # 如果语句跨多行，是否将右括号单独一行（CLion 默认 true）
  dangle_parens: true
  
  # 悬挂括号的缩进（CLion 默认与内容对齐）
  dangle_align: 'prefix'
  
  # 最小前缀字符数
  min_prefix_chars: 4
  
  # 最大前缀字符数
  max_prefix_chars: 10
  
  # 每行最大参数个数（CLion 会智能换行）
  max_subgroups_hwrap: 2
  
  # 嵌套参数的最大行数
  max_pargs_hwrap: 6
  
  # 关键字参数的最大包装行数
  max_rows_cmdline: 2
  
  # 命令大小写（CLion 默认小写）
  command_case: 'lower'
  
  # 关键字大小写（CLion 默认大写）
  keyword_case: 'upper'
  
  # 总是换行的命令（CLion 对这些命令总是换行）
  always_wrap: []

  # 算法相关
  algorithm_order: [0, 1, 2, 3, 4]
  
  # 启用排序
  enable_sort: true
  
  # 自动对齐
  autosort: false
  
  # 布局传递
  layout_passes:
    layout_pass: 2

# ====================================================
# 解析选项
# ====================================================
parse:
  # 额外的 CMake 模块或脚本路径
  additional_commands:
    # 如果有自定义命令，在这里添加
    # example_custom_command:
    #   pargs: 1
    #   flags: []
    #   kwargs:
    #     SOME_KEYWORD: '*'
  
  # 覆盖内置命令的配置
  override_spec: {}
  
  # 变量定义的关键字
  vartags: []
  
  # 属性定义的关键字
  proptags: []

# ====================================================
# 标记选项
# ====================================================
markup:
  # 启用注释格式化（CLion 会保持注释格式）
  enable_markup: false
  
  # 第一个注释是否字面保留
  first_comment_is_literal: true
  
  # 注释的字面匹配模式
  literal_comment_pattern: null
  
  # 围栏注释的字符
  fence_pattern: '^\\s*([`~]{3}[`~]*)(.*)$'
  
  # 标尺字符
  ruler_pattern: '^\\s*[^\\w\\s]{3}.*[^\\w\\s]{3}$'
  
  # 标题字符
  explicit_trailing_pattern: '#<'
  
  # 尾随注释的哈希字符
  hashruler_min_length: 10
  
  # 规则注释的最小长度
  canonicalize_hashrulers: true

# ====================================================
# 编码选项
# ====================================================
encode:
  # 输出文件的编码
  emit_byteorder_mark: false
  
  # 输入/输出的编码
  input_encoding: 'utf-8'
  output_encoding: 'utf-8'

# ====================================================
# 其他选项
# ====================================================
misc:
  # 额外的文件扩展名
  additional_extensions: []
  
  # 每行参数
  per_line_indent: 4
